name: Backend Django checks

on:
  push:
    branches: [main, feat/django-bootstrap-v1]
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ro_test
          POSTGRES_USER: ro_test
          POSTGRES_PASSWORD: ro_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ro_test -d ro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "github-actions-local-test-secret-not-for-production"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      POSTGRES_DB: ro_test
      POSTGRES_USER: ro_test
      POSTGRES_PASSWORD: ro_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund --prefix frontend
      - name: Build React frontend
        run: npm run build --prefix frontend
      - name: Verify Django served React asset paths
        run: |
          grep -q '/static/frontend/assets/' frontend/dist/index.html
          mkdir -p backend/ro_core/templates
          cp frontend/dist/index.html backend/ro_core/templates/store_app.html
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Validate Django
        run: python backend/manage.py check
      - name: Validate committed migrations
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python backend/manage.py migrate --noinput
      - name: Run backend tests
        run: python backend/manage.py test ro_core --verbosity 1
